# Borrowed with love from https://github.com/vincentarelbundock/pymarginaleffects/
# Edited slightly and reduced matrix to one element

name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python:
          #- "3.11"
          #- "3.12"
          #- "3.13"
          - "3.14"

    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          version: "latest" 

      - name: Set up Python
        run: uv python install ${{ matrix.python}}

      - name: Install dependencies
        run: uv venv

      - name: Run pytest
        run: uv run --all-extras pytest
